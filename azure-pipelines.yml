trigger:
- main

pool:
  name: self-hosted-linux

variables:
- group: datadog-aks-vars   # ONLY contains: DATADOG_API_KEY

steps:
- checkout: self

- task: AzureCLI@2
  displayName: "Auto-Discover AKS Clusters & Deploy Datadog"
  inputs:
    azureSubscription: azure-connection
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "🔹 Azure Subscription Context:"
      az account show

      echo "🔹 Discovering AKS clusters..."
      clusters=$(az aks list --query "[].{name:name,rg:resourceGroup,env:tags.env}" -o tsv)

      if [ -z "$clusters" ]; then
        echo "❌ No AKS clusters found in subscription!"
        exit 1
      fi

      echo "🔹 Initializing Terraform..."
      terraform init

      echo "$clusters" | while read name rg env; do
        echo "======================================"
        echo "🚀 Deploying Datadog Agent"
        echo "Cluster:         $name"
        echo "Resource Group:  $rg"
        echo "Environment Tag: ${env:-unknown}"
        echo "======================================"

        # Workspace isolation
        terraform workspace select $name || terraform workspace new $name

        # Terraform deploy
        TF_VAR_aks_cluster_name=$name \
        TF_VAR_aks_resource_group=$rg \
        TF_VAR_env=${env:-unknown} \
        TF_VAR_datadog_api_key=$(DATADOG_API_KEY) \
        terraform apply -auto-approve

        echo "✔ Completed deployment for $name"
      done
