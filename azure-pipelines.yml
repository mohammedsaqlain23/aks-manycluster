trigger:
- main

pool:
  name: self-hosted-linux

variables:
- group: datadog-aks-vars   # ONLY has DATADOG_API_KEY

steps:
- checkout: self

- task: AzureCLI@2
  displayName: "Auto-Discover AKS Clusters & Deploy Datadog"
  inputs:
    azureSubscription: azure-connection
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "🔹 Discovering AKS clusters in subscription..."
      clusters=$(az aks list --query "[].{name:name,rg:resourceGroup}" -o tsv)

      if [ -z "$clusters" ]; then
        echo "❌ No AKS clusters found!"
        exit 1
      fi

      echo "🔹 Initializing Terraform..."
      terraform init

      echo "$clusters" | while read name rg; do
        echo "======================================"
        echo "🚀 Cluster: $name"
        echo "🗂 Resource Group: $rg"
        echo "======================================"

        echo "🔹 Fetching kubeconfig for $name..."
        az aks get-credentials -n $name -g $rg --overwrite-existing

        # Skip logic if Datadog already exists
        if kubectl get namespace datadog >/dev/null 2>&1; then
          echo "✔ Datadog already installed on $name → Skipping..."
          continue
        fi

        echo "🔹 Deploying Datadog to $name..."

        terraform workspace select $name || terraform workspace new $name

        TF_VAR_aks_cluster_name=$name \
        TF_VAR_aks_resource_group=$rg \
        TF_VAR_datadog_api_key=$(DATADOG_API_KEY) \
        terraform apply -auto-approve

        echo "✔ Completed deployment for $name"
      done

      echo "🎉 Bulk Deployment Completed!"
